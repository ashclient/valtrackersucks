name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test analytics
        run: npm test
      - name: Check app JavaScript syntax
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check src/renderer.js
          node --check src/analytics.cjs
          node --check electron/catalog.cjs
          node --check electron/local-data.cjs
          node --check server/rso-server.cjs
          node --check scripts/generate-icons.cjs
      - name: Package Windows application
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VTS-Windows-unsigned
          path: |
            dist/*.exe
          if-no-files-found: error
