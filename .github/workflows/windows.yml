name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test analytics
        run: npm test
      - name: Check app JavaScript syntax
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check src/renderer.js
          node --check src/analytics.cjs
          node --check electron/catalog.cjs
          node --check electron/local-data.cjs
          node --check server/rso-server.cjs
          node --check scripts/generate-icons.cjs
      - name: Package Windows application
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VTS-Windows-unsigned
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish Windows preview release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0"
          $artifacts = @(Get-ChildItem "dist" -Filter "*.exe")
          if ($artifacts.Count -lt 1) { throw "No Windows installers created" }
          $exePaths = @($artifacts | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @exePaths --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @exePaths --title "VTS v0.2.0" --notes "Independent VALORANT desktop companion for Windows. Includes local match analytics, agent presets, lightweight overlay, static skin library and optional Riot-approved RSO integration. Unsigned build; Riot live account features require approved credentials." --target $env:GITHUB_SHA --latest --repo $env:GITHUB_REPOSITORY
          }

