name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test application
        run: npm test
      - name: Check app JavaScript syntax
        shell: pwsh
        run: |
          node --check electron/store.cjs
          node --check electron/presentation.cjs
          node --check src/companion.js
          node --check electron/history-sync.cjs
          node --check electron/agent-panel.cjs
          node --check src/modes.js
          node --check src/menu.js
          node --check electron/match-monitor.cjs
          node --check src/match-view.js
          node --check electron/client.cjs
          node --check electron/shortcuts.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check src/renderer.js
          node --check src/analytics.cjs
          node --check electron/catalog.cjs
          node --check electron/local-data.cjs
          node --check server/rso-server.cjs
          node --check scripts/generate-icons.cjs
      - name: Package Windows application
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VTS-Windows-unsigned
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish Windows preview release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid application version"
          }
          $tag = "v$version"
          $artifacts = @(Get-ChildItem "dist" -Filter "*.exe")
          if ($artifacts.Count -lt 1) { throw "No Windows installers created" }
          $exePaths = @($artifacts | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @exePaths --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @exePaths --title "VTS $tag" --notes-file .github/RELEASE_NOTES.md --target $env:GITHUB_SHA --latest --repo $env:GITHUB_REPOSITORY
          }

